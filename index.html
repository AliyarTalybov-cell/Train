<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11161B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Дневник">
  <title>Дневник тренировок</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <script>try{var r=document.documentElement,t=localStorage.getItem("gym-theme"),p=localStorage.getItem("gym-palette"),a=localStorage.getItem("gym-accent");if(t==="light"||t==="dark")r.dataset.theme=t;if(p&&/^\w+$/.test(p))r.dataset.palette=p;if(a&&/^\w+$/.test(a))r.dataset.accent=a}catch(e){}</script>
</head>
<body>
  <div class="netbar" id="netbar"></div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
